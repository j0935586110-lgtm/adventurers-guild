<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>任務詳情 - 冒險者公會</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <a href="/" class="logo">⚔️ 冒險者公會</a>
    <div class="nav-right">
      <span id="userArea"></span>
      <button id="btnLogin" class="btn btn-outline">登入</button>
      <button id="btnLogout" class="btn btn-outline" style="display:none">登出</button>
    </div>
  </div>
</nav>
<main class="container">
  <div id="taskDetail" class="task-detail">
    <div class="loading">🏰 載入任務中...</div>
  </div>
</main>

<div id="loginModal" class="modal" style="display:none">
  <div class="modal-content modal-sm">
    <span class="modal-close" onclick="closeLoginModal()">&times;</span>
    <h2>🏰 進入公會</h2>
    <div id="loginForm">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="your@email.com">
      <label>密碼</label>
      <input type="password" id="loginPassword" placeholder="至少 6 位">
      <button class="btn btn-primary btn-full" onclick="handleLogin()">登入</button>
      <button class="btn btn-outline btn-full" style="margin-top:5px" onclick="handleSignup()">註冊</button>
    </div>
    <div id="loginMsg" style="margin-top:10px;color:#e74c3c;text-align:center"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://wrwsjlydozfzejixofwm.supabase.co'
const SUPABASE_KEY = 'sb_publishable_ri-Jt8XuWTrnI1RCKuVdMQ_f4LARc7Y'
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
let currentUser = null
let currentProfile = null

async function init() {
  const { data: { user } } = await supabase.auth.getUser()
  currentUser = user
  if (user) {
    const { data: p } = await supabase.from('users').select('*').eq('id', user.id).single()
    currentProfile = p
  }
  updateUI()
  loadTask()
}

function updateUI() {
  const userArea = document.getElementById('userArea')
  const btnLogin = document.getElementById('btnLogin')
  const btnLogout = document.getElementById('btnLogout')
  if (currentProfile) {
    userArea.innerHTML = `<a href="/profile" class="user-link">👤 ${escHtml(currentProfile.display_name)}</a> <span style="color:#f1c40f">💰 ${currentProfile.balance_g_coin||0}G</span>`
    btnLogin.style.display = 'none'; btnLogout.style.display = 'inline-block'
  } else {
    userArea.innerHTML = ''
    btnLogin.style.display = 'inline-block'; btnLogout.style.display = 'none'
  }
}

async function loadTask() {
  const params = new URLSearchParams(window.location.search)
  const id = params.get('id')
  if (!id) { window.location.href = '/'; return }

  const { data: quest, error } = await supabase.from('quests').select(`
    *,
    client:users!quests_client_id_fkey(display_name, reputation_points, balance_g_coin),
    adventurer:users!quests_adventurer_id_fkey(display_name, reputation_points)
  `).eq('id', id).single()

  const detail = document.getElementById('taskDetail')
  if (error || !quest) { detail.innerHTML = `<div class="loading">❌ 任務不存在</div>`; return }

  const catMap = { combat:'⚔️ 戰鬥', gathering:'🌿 採集', daily:'📋 日常', magic_tech:'🔮 魔法科技', other:'📦 其他' }
  const statusMap = { posted:'🟢 招募中', accepted:'🟡 進行中', submitted:'📦 待驗收', verified:'✅ 已完成', canceled:'⚫ 已取消', disputed:'🔴 爭議中', expired:'⏰ 已過期' }

  const isMine = currentProfile && quest.client_id === currentProfile.id
  const isTaken = currentProfile && quest.adventurer_id === currentProfile.id

  let actions = ''
  if (currentProfile && quest.status === 'posted' && !isMine)
    actions += `<button class="btn btn-primary" onclick="doAccept('${quest.id}')">⚔️ 接取任務</button>`
  if (isTaken && quest.status === 'accepted')
    actions += `<button class="btn btn-primary" onclick="doSubmit('${quest.id}')">📦 提交成果</button><button class="btn btn-outline" onclick="doDrop('${quest.id}')">放棄</button>`
  if (isMine && quest.status === 'submitted')
    actions += `<button class="btn btn-primary" onclick="doRelease('${quest.id}')">✅ 驗收撥款</button>`
  if (isMine && (quest.status === 'posted' || quest.status === 'accepted'))
    actions += `<button class="btn btn-outline" onclick="doCancel('${quest.id}')">取消任務</button>`

  detail.innerHTML = `
    <a href="/" style="color:#e94560;text-decoration:none;">← 回到看板</a>
    <h1 style="margin-top:16px">${escHtml(quest.title)}</h1>
    <div class="task-detail-meta">
      <span>${statusMap[quest.status] || quest.status}</span>
      <span>${catMap[quest.category] || ''}</span>
      <span>💰 ${quest.reward_g_coin || 0} G</span>
      ${quest.deadline ? `<span>📅 ${new Date(quest.deadline).toLocaleDateString('zh-TW')}</span>` : ''}
    </div>
    <div class="task-detail-desc">${escHtml(quest.description)}</div>
    <div style="display:flex;gap:20px;margin-bottom:16px">
      <div><strong>發案者</strong><br>👤 ${escHtml(quest.client?.display_name||'未知')} ⭐${quest.client?.reputation_points||0}</div>
      ${quest.adventurer ? `<div><strong>接案者</strong><br>👤 ${escHtml(quest.adventurer?.display_name||'未知')} ⭐${quest.adventurer?.reputation_points||0}</div>` : ''}
    </div>
    <div class="task-detail-actions">${actions}</div>
    <small style="color:#666">發佈於 ${new Date(quest.created_at).toLocaleString('zh-TW')}</small>
  `
}

async function doAccept(id) { if(!currentProfile) return openLoginModal(); await supabase.rpc('accept_quest',{p_adventurer_id:currentProfile.id,p_quest_id:id}); await refresh(); loadTask() }
async function doSubmit(id) { await supabase.rpc('submit_quest_proof',{p_adventurer_id:currentProfile.id,p_quest_id:id}); await refresh(); loadTask() }
async function doRelease(id) { await supabase.rpc('release_quest_escrow',{p_client_id:currentProfile.id,p_quest_id:id}); await refresh(); loadTask() }
async function doCancel(id) { if(!confirm('確定取消？G幣退回')) return; await supabase.rpc('cancel_quest_escrow',{p_client_id:currentProfile.id,p_quest_id:id}); await refresh(); loadTask() }
async function doDrop(id) { if(!confirm('確定放棄？')) return; await supabase.rpc('cancel_quest_escrow',{p_client_id:currentProfile.id,p_quest_id:id}); await refresh(); loadTask() }
async function refresh() {
  if (currentUser) { const {data:p} = await supabase.from('users').select('*').eq('id',currentUser.id).single(); currentProfile = p; updateUI() }
}

function openLoginModal() { document.getElementById('loginModal').style.display = 'flex' }
function closeLoginModal() { document.getElementById('loginModal').style.display = 'none' }

async function handleLogin() {
  const { data, error } = await supabase.auth.signInWithPassword({
    email: document.getElementById('loginEmail').value,
    password: document.getElementById('loginPassword').value
  })
  if (error) { document.getElementById('loginMsg').textContent = '❌ ' + error.message; return }
  currentUser = data.user
  const { data: p } = await supabase.from('users').select('*').eq('id', data.user.id).single()
  currentProfile = p
  closeLoginModal(); updateUI(); loadTask()
}

async function handleSignup() {
  const email = document.getElementById('loginEmail').value
  const password = document.getElementById('loginPassword').value
  if (!email||!password) return
  const { data, error } = await supabase.auth.signUp({ email, password, options: { data: { name: email.split('@')[0] } } })
  if (error) { document.getElementById('loginMsg').textContent = '❌ ' + error.message; return }
  currentUser = data.user
  await new Promise(r=>setTimeout(r,1000))
  const { data: p } = await supabase.from('users').select('*').eq('id', data.user.id).single()
  currentProfile = p
  closeLoginModal(); updateUI(); loadTask()
}

async function handleLogout() { await supabase.auth.signOut(); currentUser=null; currentProfile=null; window.location.href='/' }

function escHtml(s) { if(!s)return''; return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

document.getElementById('btnLogin').addEventListener('click',openLoginModal)
document.getElementById('btnLogout').addEventListener('click',handleLogout)
init()
</script>
</body>
</html>
