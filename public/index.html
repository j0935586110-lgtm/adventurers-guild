<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>冒險者公會</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <a href="/" class="logo">⚔️ 冒險者公會</a>
    <div class="nav-right">
      <button id="btnPost" class="btn btn-primary">📋 發佈任務</button>
      <span id="userArea"></span>
      <button id="btnLogin" class="btn btn-outline">登入</button>
      <button id="btnLogout" class="btn btn-outline" style="display:none">登出</button>
    </div>
  </div>
</nav>

<main class="container">
  <div class="stats-bar">
    <span id="statsOpen">載入中...</span>
    <div class="filter-bar">
      <select id="filterStatus" class="select-sm">
        <option value="">全部狀態</option>
        <option value="posted">招募中</option>
        <option value="accepted">進行中</option>
        <option value="submitted">待驗收</option>
        <option value="verified">已完成</option>
      </select>
    </div>
  </div>
  <div id="taskBoard" class="task-grid">
    <div class="loading">🏰 公會看板載入中...</div>
  </div>
</main>

<!-- Post Modal -->
<div id="postModal" class="modal" style="display:none">
  <div class="modal-content">
    <span class="modal-close" onclick="closeModal()">&times;</span>
    <h2>📋 發佈新任務</h2>
    <form id="postForm" onsubmit="postQuest(event)">
      <label>任務標題</label>
      <input type="text" id="postTitle" required placeholder="例如：幫我設計一個 logo">
      <label>任務描述</label>
      <textarea id="postDesc" rows="4" required placeholder="詳細描述..."></textarea>
      <label>懸賞 G 幣</label>
      <input type="number" id="postReward" value="10" min="1">
      <label>分類</label>
      <select id="postCategory">
        <option value="daily">日常任務</option>
        <option value="combat">戰鬥任務</option>
        <option value="gathering">採集任務</option>
        <option value="magic_tech">魔法科技</option>
        <option value="other">其他</option>
      </select>
      <button type="submit" class="btn btn-primary btn-full">🗡️ 發佈任務</button>
    </form>
  </div>
</div>

<!-- Login Modal -->
<div id="loginModal" class="modal" style="display:none">
  <div class="modal-content modal-sm">
    <span class="modal-close" onclick="closeLoginModal()">&times;</span>
    <h2>🏰 進入公會</h2>
    <div id="loginForm">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="your@email.com">
      <label>密碼</label>
      <input type="password" id="loginPassword" placeholder="至少 6 位">
      <button class="btn btn-primary btn-full" onclick="handleLogin()">登入</button>
      <button class="btn btn-outline btn-full" style="margin-top:5px" onclick="handleSignup()">註冊新冒險者</button>
    </div>
    <div id="loginMsg" style="margin-top:10px;color:#e74c3c;text-align:center"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
